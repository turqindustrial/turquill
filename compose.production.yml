services:
  turquill:
    build: .
    user: "1000:1000"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    volumes: ["turquill-data:/data"]
    environment:
      TURQUILL_DATA: /data
      TURQUILL_PUBLIC_ORIGIN: ${TURQUILL_PUBLIC_ORIGIN:?Set the HTTPS game origin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Supply the host secret privately}
      TURQUILL_MAIL_SENDER: ${TURQUILL_MAIL_SENDER:?Set the dedicated Gmail address}
      TURQUILL_MAIL_PASSWORD: ${TURQUILL_MAIL_PASSWORD:?Supply the Gmail app password privately}
volumes:
  turquill-data:
